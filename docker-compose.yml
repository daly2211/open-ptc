
services:
  open-ptc:
    build: .
    container_name: open-ptc
    ports:
      - "9730:9730"  # API Server
      - "9731:9731"  # MCP Server
      - "9733:9733"  # WebSocket Server
      - "9734:9734"  # Open-PTC Proxy
      # RPC Server (9732) is internal-only, not exposed
    environment:
      - API_SERVER_PORT=9730
      - MCP_SERVER_PORT=9731
      - RPC_SERVER_PORT=9732
      - WS_SERVER_PORT=9733
      - PROXY_PORT=9734
      - RPC_SERVER_URL=http://localhost:9732
      - API_BASE_URL=http://localhost:9730
      - CODE_EXECUTION_TIMEOUT_MS=30000
      - LITELLM_URL=http://litellm:4000
    volumes:
      - ./mcp_config.json:/app/mcp_config.json:ro
    env_file:
      - .env
    depends_on:
      - litellm
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4001:4000"
    volumes:
      - ./litellm_config.yaml:/config.yaml:ro
    command: --config /config.yaml
    env_file:
      - .env
    restart: unless-stopped
